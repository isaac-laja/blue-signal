title: Encoded PowerShell Command Execution (Process Creation)
id: 
status: test
description: Detects execution of PowerShell with an encoded command using Sysmon process creation logs
references: 
  - https://attack.mitre.org/techniques/T1059/001/
author: Isaac Laja
date: 2026/07/27
logsource: 
  product: windows 
  category: process_creation
detection:
  selection: 
    CommandLine|re: 
      - '-EncodedCommand'
      - '-encodedcommand'
      - '-enc'
      - 'ec'
      - 'e'
  condition: selection
level: high
tags: 
  - attack.Execution
  - attack.t1059.001
