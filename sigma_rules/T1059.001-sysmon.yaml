title: T1059.001 Detection with sysmon logs
status: test
description: Detects execution of Powershell with an endocded command using sysmon logs
references: 
  - https://attack.mitre.org/techniques/T1059/001/
author: Isaac Laja
date: 2026/07/27
logsource: 
  products: windows 
  category: registry_event 
detection:
  selection: 
    CommandLine|contains: 
      - '-e'
      - '-ec'
      - '-en'
      - '-EncodedCommand'
      - '-encodedcommand'
      - '-enc'
  condition: selection
tags: 
  - attack.Execution
  - attack.T1059.001
